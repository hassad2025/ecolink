# .github/workflows/ci.yml — CI/CD EcoLink Frontend
# Déclenché à chaque push sur main ou pull request

name: CI/CD Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint + Build ─────────────────────────────────────
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ecolink-frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: ecolink-frontend
        run: npm ci

      - name: Lint ESLint
        working-directory: ecolink-frontend
        run: npm run lint

      - name: Build Next.js
        working-directory: ecolink-frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Build Docker (seulement sur main) ────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build image Docker
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ecolink.fr \
            -t ecolink-frontend:latest \
            ./ecolink-frontend

      - name: Vérifier l'image
        run: docker images ecolink-frontend
